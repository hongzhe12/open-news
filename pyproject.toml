[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "open-news-search"
version = "0.1.0"
description = "Search and extract Chinese news articles"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx",
    "jieba",
    "lxml",
    "python-dateutil",
]

[project.scripts]
open-news = "open_news.cli:main"

[tool.setuptools.packages.find]
include = ["open_news*"]

[dependency-groups]
dev = ["pytest"]
