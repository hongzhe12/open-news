[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "open-news-search"
version = "0.1.0"
description = "Search Chinese news articles"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx",
    "jieba",
    "lxml",
]

[project.scripts]
news = "open_news.cli:main"

[tool.setuptools.packages.find]
include = ["open_news*"]

[dependency-groups]
dev = [
    "pyinstrument>=5.1.3",
    "pytest",
]


[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
